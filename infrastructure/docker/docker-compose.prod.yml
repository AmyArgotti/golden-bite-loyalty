services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web
      - staff-panel
      - admin-panel
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - app_data:/var/lib/golden-bite
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  staff-panel:
    build:
      context: ../../apps/staff-panel
      args:
        NEXT_PUBLIC_BASE_PATH: /staff
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: /staff
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/staff"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-panel:
    build:
      context: ../../apps/admin-panel
      args:
        NEXT_PUBLIC_BASE_PATH: /admin
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: /admin
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info
    env_file:
      - ../../.env
    volumes:
      - app_data:/var/lib/golden-bite
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker-ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golden_bite}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  app_data:
